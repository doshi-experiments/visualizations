<!--
  ═══════════════════════════════════════════════════════════════════
  SHEET E-03 — VISUALIZATIONS

  Four exhibits on one sheet, sharing a shell:

    E-03.1  Growth Cage — balls in a cage, every collision spawns
            another. Collision rate goes as N², so the obvious
            prediction is a finite-time blow-up. It measures out below
            N¹ instead: the balls cool as they multiply, and newborns
            run out of room. The chart exists to show that break.

    E-03.2  Silk — k-fold symmetric drawing. The strands fan apart
            when you move fast and bunch when you move slowly, which
            is the whole trick.

    E-03.3  Divergence — 120 double pendulums a billionth of a radian
            apart, staying together, then not.

    E-03.4  Harmonograph — the same pendulums, hung off your cursor
            and used as a brush. A dragged pivot is a non-inertial
            frame, so it is your acceleration that swings them, not
            your speed.

  Adding an exhibit is one module in public/js/ plus one line in the
  registry at the bottom of this file. That is the whole content model.

  Sheet E-03 · Companion to A-001 and A-002 · Rishabh Doshi
  hello@rishabhdoshi.com
  ═══════════════════════════════════════════════════════════════════
-->
