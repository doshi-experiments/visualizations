<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════════
  SHEET E-03 — VISUALIZATIONS

  Three exhibits on one sheet, sharing a shell:

    E-03.1  Growth Cage — two balls in a cage, every collision spawns
            a third. Collision rate goes as N², so dN/dt ∝ N², which
            blows up in *finite time* rather than merely exponentially.
            The chart is there to make that difference legible.

    E-03.2  Silk — k-fold symmetric drawing. The strands fan apart
            when you move fast and bunch when you move slowly, which
            is the whole trick.

    E-03.3  Divergence — 120 double pendulums a billionth of a radian
            apart, staying together, then not.

  Adding an exhibit is one module in public/js/ plus one line in the
  registry at the bottom of this file. That is the whole content model.

  Sheet E-03 · Companion to A-001 and A-002 · Rishabh Doshi
  hello@rishabhdoshi.com
  ═══════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualizations — Rishabh Doshi</title>
<meta name="description" content="Three interactive exhibits: a cage where every collision spawns a new ball and the population blows up in finite time, a k-fold symmetric drawing surface, and 120 double pendulums coming apart.">
<meta name="color-scheme" content="dark light">
<!-- Theme is stamped on <html> before the first paint. Anything later
     and the light-mode visitor gets a dark flash on every load.
     The choice lives in a cookie scoped to .rishabhdoshi.com so it
     carries across the portfolio, the experiments index and the
     calculator — localStorage can't, being per-origin. -->
<script>
(function(){
  var m=document.cookie.match(/(?:^|;\s*)sheet-theme=(light|dark)/),t=m&&m[1];
  if(!t){ try{ t=localStorage.getItem('sheet-theme'); }catch(e){} }
  if(t!=='light'&&t!=='dark')
    t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
/* ─────────────────────────────────────────────────────────────
   0 · Tokens  (the whole drawing is inked from these)
   ───────────────────────────────────────────────────────────── */
:root{
  color-scheme:dark;
  --paper-0:#081b30;          /* deep field                    */
  --paper-1:#0f2c4c;          /* blueprint blue                */
  --line-1:rgba(146,206,255,.10);  /* minor grid               */
  --line-2:rgba(146,206,255,.20);  /* major grid               */
  --ink:#e6f3ff;              /* drafting white                */
  --ink-dim:#9fc3e2;          /* secondary lettering           */
  --accent:#7fd4ff;           /* cyan pen                      */
  --safety:#ffb277;           /* crane peach                   */
  --go:#8fe3ae;               /* topped-out green              */
  --redline:#ff6a5c;          /* reviewer's pencil             */
  --card:rgba(7,22,40,.78);   /* annotation paper              */
  --card-edge:rgba(146,206,255,.35);
  --cage:rgba(146,206,255,.55);

  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",
         Menlo,Consolas,"Liberation Mono",monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --paper-0:#e8ecf0; --paper-1:#ffffff;
  --line-1:rgba(18,41,62,.07); --line-2:rgba(18,41,62,.14);
  --ink:#12293e; --ink-dim:#4d6b85;
  --accent:#0f6ea3; --safety:#b8620f; --go:#1c7a45; --redline:#c02a1c;
  --card:rgba(255,255,255,.86); --card-edge:rgba(18,41,62,.28);
  --cage:rgba(18,41,62,.45);
}

/* ─────────────────────────────────────────────────────────────
   1 · Sheet  (page = a drawing sheet)
   ───────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--mono);
  color:var(--ink);
  background:radial-gradient(1200px 800px at 50% 38%, var(--paper-1), var(--paper-0) 75%);
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
/* drafting grid, drawn — not downloaded */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,  var(--line-1) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, var(--line-1) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(0deg,  var(--line-2) 0 1px, transparent 1px 140px),
    repeating-linear-gradient(90deg, var(--line-2) 0 1px, transparent 1px 140px);
}
::selection{background:var(--safety);color:#0a2036}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px dashed var(--accent);outline-offset:3px}

/* corner registration marks */
.mark{position:fixed;width:22px;height:22px;z-index:6;pointer-events:none;
  border:1px solid var(--line-2)}
.mark.tl{top:14px;left:14px;border-right:0;border-bottom:0}
.mark.tr{top:14px;right:14px;border-left:0;border-bottom:0}
.mark.bl{bottom:14px;left:14px;border-right:0;border-top:0}
.mark.br{bottom:14px;right:14px;border-left:0;border-top:0}

/* ─────────────────────────────────────────────────────────────
   2 · Header block
   ───────────────────────────────────────────────────────────── */
header{position:fixed;top:0;left:0;right:0;z-index:5;padding:26px 44px 0;
  pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-dim)}
h1{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  margin-top:5px}
h1 i{font-style:normal;color:var(--accent);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* theme switch — a real switch, not a div */
#theme{position:fixed;top:13px;right:44px;z-index:7;width:48px;height:24px;
  border:1px solid var(--card-edge);border-radius:12px;background:var(--card);
  pointer-events:auto}
#theme::after{content:"☾";position:absolute;top:1px;left:1px;width:20px;height:20px;
  border-radius:50%;background:var(--accent);color:var(--paper-0);
  font-size:11px;line-height:20px;text-align:center;
  transition:transform .22s ease}
:root[data-theme="light"] #theme::after{content:"☀";transform:translateX(24px)}

/* ─────────────────────────────────────────────────────────────
   3 · Tab strip  (the exhibit switcher)
   ───────────────────────────────────────────────────────────── */
#tabs{position:fixed;top:70px;left:44px;z-index:5;display:flex;gap:8px;
  flex-wrap:wrap;pointer-events:auto}
#tabs button{padding:7px 12px;border:1px solid var(--card-edge);
  background:var(--card);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-dim);white-space:nowrap}
#tabs button[aria-selected="true"]{color:var(--paper-0);background:var(--accent);
  border-color:var(--accent)}
#tabs .code{opacity:.6;margin-right:6px}
#tabs button[aria-selected="true"] .code{opacity:.75}

/* ─────────────────────────────────────────────────────────────
   4 · Stage  (where the exhibits live)
   ───────────────────────────────────────────────────────────── */
#stage{position:fixed;inset:0;z-index:1}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage.grab{cursor:crosshair}

/* ─────────────────────────────────────────────────────────────
   5 · Control panel
   ───────────────────────────────────────────────────────────── */
#panel{position:fixed;top:112px;left:44px;bottom:52px;width:264px;z-index:4;
  background:var(--card);border:1px solid var(--card-edge);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:flex;flex-direction:column;overflow:hidden}
#panel .phead{display:flex;align-items:center;justify-content:space-between;
  padding:10px 13px;border-bottom:1px solid var(--card-edge);
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
#panel .pbody{overflow-y:auto;overscroll-behavior:contain;padding:4px 0 10px;
  scrollbar-width:thin}
#panel[data-open="false"] .pbody{display:none}
/* Collapsed, the panel should shrink to its header. On a wide sheet it
   is top-anchored, so release the bottom edge; on a narrow one it is
   bottom-anchored and must stay that way, which is why this is scoped
   rather than written as a bare attribute rule — the attribute
   selector would otherwise outrank the mobile media query. */
@media (min-width:921px){ #panel[data-open="false"]{bottom:auto} }

fieldset{border:0;border-top:1px solid var(--line-2);margin-top:8px;padding:8px 13px 2px}
fieldset:first-of-type{border-top:0;margin-top:2px}
legend{font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-dim);padding:0 0 4px}
fieldset[hidden]{display:none}

.ctl{padding:7px 0}
.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10px;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:5px;gap:8px}
.ctl .val{color:var(--accent);font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}

/* range — drawn as a drafting slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;
  background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-2)}
input[type=range]::-moz-range-track{height:2px;background:var(--line-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
  margin-top:-4.5px;background:var(--accent);border:0;border-radius:0;
  transform:rotate(45deg)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--accent);
  border:0;border-radius:0}

select{width:100%;padding:6px 8px;background:var(--paper-0);
  border:1px solid var(--card-edge);font-size:10px;letter-spacing:.06em;
  cursor:pointer;border-radius:0}

/* toggle — a real checkbox, styled */
.ctl.tog label{display:flex;align-items:center;justify-content:space-between;
  gap:10px;cursor:pointer;font-size:10px;letter-spacing:.08em;color:var(--ink-dim)}
.ctl.tog input{appearance:none;-webkit-appearance:none;width:34px;height:16px;
  flex:0 0 34px;border:1px solid var(--card-edge);background:transparent;
  position:relative;cursor:pointer;border-radius:8px}
.ctl.tog input::after{content:"";position:absolute;top:1px;left:1px;
  width:12px;height:12px;border-radius:50%;background:var(--ink-dim);
  transition:transform .16s ease,background .16s ease}
.ctl.tog input:checked{border-color:var(--accent)}
.ctl.tog input:checked::after{transform:translateX(18px);background:var(--accent)}

.btnrow{display:flex;gap:6px;flex-wrap:wrap;padding:7px 0}
.btn{padding:9px 13px;border:1px solid var(--card-edge);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);flex:1;
  white-space:nowrap;background:transparent}
.btn:hover{color:var(--ink);border-color:var(--accent)}
.btn.danger{border-style:dashed;color:var(--redline);border-color:var(--redline)}
.btn.primary{color:var(--accent);border-color:var(--accent)}

/* ─────────────────────────────────────────────────────────────
   6 · Title block  (live telemetry, right side)
   ───────────────────────────────────────────────────────────── */
#titleblock{position:fixed;top:112px;right:44px;width:224px;z-index:4;
  background:var(--card);border:1px solid var(--card-edge);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  padding:11px 13px;font-size:10px;letter-spacing:.06em}
#tbRows{display:block}
#titleblock .row{display:flex;justify-content:space-between;gap:10px;
  padding:3px 0;color:var(--ink-dim)}
#titleblock .row b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;
  text-align:right}
#bar{height:3px;background:var(--line-2);margin-top:9px}
#barFill{height:100%;width:0;background:var(--accent);transition:width .2s linear}
#tbNote{margin-top:9px;padding-top:8px;border-top:1px solid var(--line-2);
  color:var(--ink-dim);line-height:1.5;font-size:9.5px}
#tbNote b{color:var(--go)}

/* chart panel */
#chartwrap{position:fixed;right:44px;bottom:52px;width:224px;z-index:4;
  background:var(--card);border:1px solid var(--card-edge);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:9px 10px 7px}
#chartwrap[hidden]{display:none}
#chartwrap .chead{display:flex;justify-content:space-between;font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);
  margin-bottom:6px}
#chartwrap canvas{width:100%;height:104px;display:block}
#chartFoot{margin-top:6px;font-size:9px;color:var(--ink-dim);line-height:1.55}
#chartFoot b{color:var(--accent);font-weight:500}

/* ─────────────────────────────────────────────────────────────
   7 · Microtag + hint
   ───────────────────────────────────────────────────────────── */
.microtag{position:fixed;left:44px;bottom:20px;z-index:5;font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);opacity:.75}
#hint{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:5;
  padding:9px 15px;background:var(--card);border:1px solid var(--card-edge);
  font-size:10px;letter-spacing:.1em;color:var(--ink-dim);pointer-events:none;
  transition:opacity .4s ease;text-align:center;max-width:min(90vw,460px)}
#hint[hidden]{display:none}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ─────────────────────────────────────────────────────────────
   8 · Narrow screens — panel becomes a bottom drawer
   ───────────────────────────────────────────────────────────── */
/* The stage is a horizontal band between the two panels on a wide
   sheet, and a vertical one between them on a narrow sheet: title
   block above, controls below, neither overlapping the drawing.
   safeRect() in shell.js has to agree with these numbers. */
@media (max-width:920px){
  header{padding:16px 20px 0}
  header .eyebrow .long{display:none}
  #theme{right:20px;top:11px}
  #tabs{left:20px;right:20px;top:58px}
  #tabs button{padding:6px 9px;font-size:9px}
  /* Telemetry flows into two columns; the static "Sheet E-03" row is
     dropped because the eyebrow directly above already says it. */
  #titleblock{top:96px;bottom:auto;right:8px;left:8px;width:auto;
    padding:9px 11px;max-height:136px;overflow-y:auto;overscroll-behavior:contain}
  #titleblock > .row:first-child{display:none}
  #tbRows{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  #titleblock .row{padding:2px 0}
  #chartwrap{display:none}
  .microtag{display:none}
  #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:40vh}
  #hint{bottom:auto;top:auto;position:fixed;left:8px;right:8px;
    transform:none;max-width:none;top:242px}
}
@media (max-width:420px){
  h1{font-size:12px}
  #tabs button .name{display:none}
  #tabs .code{margin-right:0}
}

/* Nothing moves unasked. Exhibits mount paused; see shell.js. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;
    animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="mark tl"></div><div class="mark tr"></div>
<div class="mark bl"></div><div class="mark br"></div>

<header>
  <div class="eyebrow">Sheet E-03 · Visualizations<span class="long"> · Issued for Review</span></div>
  <h1 id="exhibitTitle">Growth Cage<i>▌</i></h1>
</header>

<button id="theme" role="switch" aria-checked="false" aria-label="Toggle light or dark sheet"></button>

<nav id="tabs" role="tablist" aria-label="Exhibits"></nav>

<main id="stage" role="img" aria-label="Interactive visualization"></main>

<aside id="panel" data-open="true">
  <div class="phead">
    <span>Controls</span>
    <button id="panelToggle" aria-expanded="true" aria-controls="panelBody"
            style="letter-spacing:.1em">Hide</button>
  </div>
  <div class="pbody" id="panelBody"></div>
</aside>

<div id="titleblock">
  <div class="row"><span>Sheet</span><b>E-03</b></div>
  <div id="tbRows"></div>
  <div id="bar" role="presentation"><div id="barFill"></div></div>
  <div id="tbNote" hidden></div>
</div>

<div id="chartwrap" hidden>
  <div class="chead"><span id="chartTitle">Population</span><span id="chartScale">log N</span></div>
  <canvas id="chart" width="400" height="208"></canvas>
  <div id="chartFoot"></div>
</div>

<div id="hint" hidden></div>
<div class="microtag">Built With ♥ Using Claude · Do Not Scale Drawing</div>
<div id="live" role="status" aria-live="polite"></div>

<noscript>
  <div style="position:fixed;inset:0;z-index:20;overflow:auto;padding:60px 44px;
              background:var(--paper-0);font-family:var(--mono);color:var(--ink);
              line-height:1.7;font-size:13px">
    <div style="max-width:640px">
      <p style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;
                color:var(--ink-dim)">Sheet E-03 · Visualizations</p>
      <h2 style="font-size:15px;letter-spacing:.14em;text-transform:uppercase;
                 margin:8px 0 20px">Three exhibits, all of which need JavaScript</h2>

      <p style="margin-bottom:18px"><b>E-03.1 · Growth Cage.</b> Two balls bounce
      inside a circular cage. Every time two collide, a third appears. The collision
      rate in a gas scales with the square of the population, so the obvious
      prediction is that the count runs to infinity at a finite, calculable time.
      That holds for about a second. The page measures the actual growth exponent
      instead of assuming it, and it comes out below one: energy is shared among more
      and more balls so they slow as they multiply, and a newborn needs somewhere to
      go, which gets harder as the cage fills until it is impossible. Switch the
      energy setting to injected and the exponent visibly rises. The cage is
      logistic, not explosive, and watching the N² intuition break is the exhibit.</p>

      <p style="margin-bottom:18px"><b>E-03.2 · Silk.</b> A drawing surface with
      k-fold rotational symmetry, optionally mirrored. Each stroke is drawn as
      several fine strands that fan apart as the pointer accelerates, which is what
      reads as silk rather than as a marker.</p>

      <p style="margin-bottom:18px"><b>E-03.3 · Divergence.</b> A hundred and twenty
      double pendulums, each started a billionth of a radian from the last. They
      move as one line, then come apart all at once. The plot fits the Lyapunov
      exponent live, which is the rate at which the prediction stops being possible.</p>

      <p style="margin-top:28px;color:var(--ink-dim)">
        Sheet A-002, the index, is at
        <a style="color:#7fd4ff" href="https://experiments.rishabhdoshi.com">experiments.rishabhdoshi.com</a>.
        Sheet A-001 is at
        <a style="color:#7fd4ff" href="https://rishabhdoshi.com">rishabhdoshi.com</a>.
      </p>
    </div>
  </div>
</noscript>

<!-- Matter.js supplies the grid broad phase and the collisionStart event that the
     Growth Cage's spawn rule hangs off. Vendored and pinned rather than pulled
     from a CDN: no third-party request, and it works offline.
     A classic script, so it has run before any deferred module below. -->
<script src="vendor/matter.min.js"></script>
<script type="module" src="js/boot.js"></script>
</body>
</html>
