name: Design system checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # npm ci checks the design-system tarball against the lockfile's integrity hash.
      - run: npm ci
      - run: npm run build
